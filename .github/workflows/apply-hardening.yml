name: Publish verified design hardening
on:
  push:
    branches: [main]
    paths:
      - '.maintenance/**'
      - '.github/workflows/apply-hardening.yml'
permissions:
  contents: write
concurrency:
  group: publish-design-hardening
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'JennieXLisa/ssr-redesign' && startsWith(github.event.head_commit.message, 'docs: apply verified contract-hardening bundle')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install documentation schema validator
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Apply exact checked documentation and publish feature commits
        run: |
          python -B - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('publisher', '.maintenance/apply.py')
          publisher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(publisher)
          original_command = publisher.command
          def command(*args, **kwargs):
              is_generator = len(args) > 1 and args[1] == 'tools/build_hardening_schemas.py'
              if is_generator:
                  Path('contracts/reference').mkdir(parents=True, exist_ok=True)
              result = original_command(*args, **kwargs)
              if is_generator:
                  # Bootstrap new role keys once, then freeze their serialized order.
                  original_command(*args, **kwargs)
              return result
          publisher.command = command
          try:
              publisher.main()
          except Exception as exc:
              publisher.report['error'] = str(exc)[:2048]
              publisher.record()
              raise
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hardening-publication-${{ github.sha }}
          path: /tmp/ssr-hardening-publication/
          retention-days: 7
          if-no-files-found: warn
