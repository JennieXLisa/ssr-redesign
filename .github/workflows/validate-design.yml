name: Validate design contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install documentation validator dependency
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Validate document structure
        run: python tools/validate_docs.py
      - name: Validate hardening contracts when present
        run: |
          if test -f tools/validate_hardening.py; then
            python tools/validate_hardening.py
          fi
      - name: Capture exact design tree and validation evidence
        if: always()
        run: |
          mkdir -p /tmp/ssr-design-validation
          git rev-parse HEAD > /tmp/ssr-design-validation/commit.txt
          git rev-parse HEAD^{tree} > /tmp/ssr-design-validation/tree.txt
          git archive --format=zip --output=/tmp/ssr-design-validation/design-source.zip HEAD
          for report in validation-results.json hardening-validation.json; do
            if test -f "$report"; then cp "$report" /tmp/ssr-design-validation/; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: design-validation-${{ github.sha }}
          path: /tmp/ssr-design-validation/
          retention-days: 7
          if-no-files-found: error
