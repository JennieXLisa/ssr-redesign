- id: ssr.pattern.lua.command_execution.lexical
  languages:
  - generic
  severity: INFO
  message: Lexical reconnaissance match; no syntax or dataflow claim.
  metadata:
    ssr:
      categories:
      - command_execution
      reason: Text resembles a command-execution operation; verify it in source.
      analyzer_kind: generic
      languages:
      - lua
  pattern-regex: \b(?:os\.execute|io\.popen)\s*\(
