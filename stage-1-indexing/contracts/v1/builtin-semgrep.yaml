rules:
- id: ssr.pattern.python.command_execution.1
  languages:
  - python
  severity: INFO
  message: Reconnaissance pattern match; inspect the source and its callers.
  metadata:
    ssr:
      categories:
      - command_execution
      reason: Source matches the configured python pattern os.system(...); this is
        a navigation signal, not a vulnerability verdict.
      analyzer_kind: native
  pattern: os.system(...)
